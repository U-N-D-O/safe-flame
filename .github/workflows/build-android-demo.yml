name: Build Safe Flame Android review demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build test APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Create review demo video from the app UI flow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -t 8 -i store/google-play/1.jpg \
            -loop 1 -t 8 -i store/google-play/2.jpg \
            -loop 1 -t 8 -i store/google-play/3.jpg \
            -loop 1 -t 8 -i store/google-play/feature-graphic.jpg \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,drawbox=x=0:y=0:w=1080:h=230:color=black@0.82:t=fill,drawtext=fontfile=$FONT:text='SAFE FLAME':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=34,drawtext=fontfile=$FONT:text='1  Press Start to begin the soft flame and sound':fontcolor=white:fontsize=30:x=(w-text_w)/2:y=125[v0];
              [1:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,drawbox=x=0:y=0:w=1080:h=230:color=black@0.82:t=fill,drawtext=fontfile=$FONT:text='SAFE FLAME':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=34,drawtext=fontfile=$FONT:text='2  Leave the app or lock the screen  The service continues':fontcolor=white:fontsize=27:x=(w-text_w)/2:y=125[v1];
              [2:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,drawbox=x=0:y=0:w=1080:h=230:color=black@0.82:t=fill,drawtext=fontfile=$FONT:text='SAFE FLAME':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=34,drawtext=fontfile=$FONT:text='3  Reopen Safe Flame and press Stop to finish':fontcolor=white:fontsize=30:x=(w-text_w)/2:y=125[v2];
              [3:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,drawbox=x=0:y=0:w=1080:h=230:color=black@0.82:t=fill,drawtext=fontfile=$FONT:text='SAFE FLAME':fontcolor=white:fontsize=48:x=(w-text_w)/2:y=34,drawtext=fontfile=$FONT:text='Foreground notification keeps the service running':fontcolor=white:fontsize=27:x=(w-text_w)/2:y=115,drawtext=fontfile=$FONT:text='com.qila.safeflame':fontcolor=white:fontsize=27:x=(w-text_w)/2:y=165[v3];
              [v0][v1][v2][v3]concat=n=4:v=1:a=0[v]" \
            -map "[v]" -r 30 -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -movflags +faststart safe-flame-android-review-demo.mp4

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-flame-android-demo
          path: safe-flame-android-review-demo.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish public demo link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view safe-flame-android-demo >/dev/null 2>&1 || \
            gh release create safe-flame-android-demo \
              --title "Safe Flame Android demo" \
              --notes "Android foreground-service demonstration for Google Play review." \
              --latest=false
          gh release upload safe-flame-android-demo safe-flame-android-review-demo.mp4 --clobber
