name: Build Safe Flame Android review demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build test APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Record the real Android foreground-service demo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          cores: 4
          ram-size: 2048M
          heap-size: 256M
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            # Give System UI time to finish booting before any screenshots or
            # input events.  Hosted emulators can otherwise show a transient
            # "System UI isn't responding" dialog in the evidence video.
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            sleep 20
            adb shell settings put system screen_off_timeout 1800000 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.qila.safeflame android.permission.CAMERA
            adb shell pm grant com.qila.safeflame android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.qila.safeflame/com.undu.safeflame.MainActivity
            sleep 5
            mkdir -p review-frames
            for i in 0 1 2 3 4; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            adb shell input tap 540 750
            for i in 5 6 7 8 9 10 11; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            adb shell input keyevent KEYCODE_HOME
            for i in 12 13 14 15 16 17 18; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            adb shell input swipe 540 5 540 1500 500
            for i in 19 20 21 22 23; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell am start -n com.qila.safeflame/com.undu.safeflame.MainActivity
            for i in 24 25 26 27 28 29; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            adb shell input tap 540 750
            for i in 30 31 32 33; do adb exec-out screencap -p > "review-frames/frame-$(printf '%04d' "$i").png"; sleep 1; done
            test "$(find review-frames -name 'frame-*.png' | wc -l)" -ge 30
            adb shell am force-stop com.qila.safeflame || true

      - name: Add the selected app sound to the recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 1 -i review-frames/frame-%04d.png \
            -c:v libx264 -pix_fmt yuv420p -r 30 safe-flame-screen.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -i safe-flame-screen.mp4 \
            -stream_loop -1 -i files/SafeFlame/Resources/fireplace.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k -shortest \
            -movflags +faststart safe-flame-android-review-demo.mp4

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-flame-android-demo
          path: safe-flame-android-review-demo.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish public demo link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view safe-flame-android-demo >/dev/null 2>&1 || \
            gh release create safe-flame-android-demo \
              --title "Safe Flame Android demo" \
              --notes "Android foreground-service demonstration for Google Play review." \
              --latest=false
          gh release upload safe-flame-android-demo safe-flame-android-review-demo.mp4 --clobber
