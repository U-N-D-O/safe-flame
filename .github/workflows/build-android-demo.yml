name: Build Safe Flame Android review demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build test APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug

      - name: Record the real Android foreground-service demo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86
          profile: pixel_2
          cores: 4
          ram-size: 2048M
          heap-size: 256M
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.qila.safeflame android.permission.CAMERA
            adb shell pm grant com.qila.safeflame android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.qila.safeflame/com.undu.safeflame.MainActivity
            sleep 5
            adb shell screenrecord --bit-rate 4000000 --time-limit 52 /sdcard/safe-flame-screen.mp4 &
            sleep 3
            adb shell input tap 540 750
            sleep 7
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME
            sleep 7
            adb shell cmd statusbar expand-notifications
            sleep 5
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb shell am start -n com.qila.safeflame/com.undu.safeflame.MainActivity
            sleep 6
            adb shell dumpsys activity services com.qila.safeflame | grep -q 'FlameService' || exit 1
            adb shell input tap 540 750
            sleep 4
            adb pull /sdcard/safe-flame-screen.mp4 safe-flame-screen.mp4
            adb shell am force-stop com.qila.safeflame || true

      - name: Add the selected app sound to the recording
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y \
            -i safe-flame-screen.mp4 \
            -stream_loop -1 -i files/SafeFlame/Resources/fireplace.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k -shortest \
            -movflags +faststart safe-flame-android-review-demo.mp4

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-flame-android-demo
          path: safe-flame-android-review-demo.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish public demo link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view safe-flame-android-demo >/dev/null 2>&1 || \
            gh release create safe-flame-android-demo \
              --title "Safe Flame Android demo" \
              --notes "Android foreground-service demonstration for Google Play review." \
              --latest=false
          gh release upload safe-flame-android-demo safe-flame-android-review-demo.mp4 --clobber
