name: Build Safe Flame iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Build unsigned device app from the shared Flutter project
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/safe-flame-ipa/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/safe-flame-ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/safe-flame-ipa/Payload" SafeFlame-unsigned.ipa

      - name: Validate IPA metadata
        run: |
          app="$RUNNER_TEMP/safe-flame-ipa/Payload/Runner.app"
          test -f SafeFlame-unsigned.ipa
          test -f "$app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          short_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          build_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist")
          echo "Bundle ID: $bundle_id"
          echo "Short version: $short_version"
          echo "Build version: $build_version"
          test "$bundle_id" = "com.qila.safeflame"
          test "$short_version" = "1.0.0"
          test "$build_version" = "1"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-flame-ios-ipa
          path: SafeFlame-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct IPA download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view safe-flame-latest >/dev/null 2>&1 || gh release create safe-flame-latest --title "Safe Flame latest iOS IPA" --notes "Unsigned IPA for AltServer or AltStore."
          gh release upload safe-flame-latest SafeFlame-unsigned.ipa --clobber
